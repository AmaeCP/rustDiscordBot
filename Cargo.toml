[package]
name = "discord-music-bot"
version = "0.1.0"
edition = "2021"

[dependencies]
poise = { version = "0.6", features = ["cache"] }
serenity = { version = "0.12", features = ["cache", "client", "gateway", "rustls_backend", "model"] }
songbird = { git = "https://github.com/serenity-rs/songbird", branch = "current", features = ["builtin-queue"] }
tokio = { version = "1.38", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
url = "2.5"
symphonia = { version = "0.5", features = ["all"] }
async-trait = "0.1"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
dashmap = "6"
dotenvy = "0.15"
thiserror = "2"
rand = "0.8"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
overflow-checks = false
